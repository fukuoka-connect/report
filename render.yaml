services:
  - type: web
    name: fukuoka-connect-webhook
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webhook_server:app
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: GH_TOKEN_FC
        sync: false
      - key: GITHUB_REPO
        value: kentaro/fukuoka-connect-report
      - key: GITHUB_BRANCH
        value: main
